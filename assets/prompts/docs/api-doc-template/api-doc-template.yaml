name: api-doc-template
version: "1.0"
domain: docs
tags: [api, documentation, openapi]
description: "API 文档生成模板，输出符合 OpenAPI 规范的文档"
template: |
  请为以下 API 生成文档：

  接口路径: {{path}}
  请求方法: {{method}}
  功能描述: {{description}}
  请求参数: {{params}}
  返回格式: {{response}}

  请按以下格式输出：
  ## {{path}}
  ...
variables: [path, method, description, params, response]
adapter: universal

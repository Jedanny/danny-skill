version: 1

runtime:
  kind: "interrogate"
  profile_behavior:
    minimal: "Use SKILL.md and config-driven questioning only"
    standard: "Use the same interrogation workflow and output contract as minimal"
    full: "Use the complete skill directory"

packaging:
  minimal:
    include:
      - "SKILL.md"
      - "config.yaml"
  standard:
    include:
      - "SKILL.md"
      - "config.yaml"
  full:
    include:
      - "**"

validation:
  required_files:
    - "SKILL.md"
    - "config.yaml"
  markdown_contracts:
    - path: "SKILL.md"
      must_contain:
        - "### 当前理解"
        - "### Socratic Stress Test"
        - "### 重建解释"
        - "### 下一步"
        - "<project-knowledge-base>/distilled/"
        - "<project-knowledge-base>/learnings/"

docs:
  summary: "概念理解压测"
  handles: "学懂概念、框架、文章、方法"
  not_for: "直接替代长期知识归档或研究报告"
  artifacts:
    - "定义"
    - "边界"
    - "反例"
    - "原因链"
    - "后续跳转建议"

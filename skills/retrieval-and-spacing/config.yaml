version: 1

runtime:
  kind: "retain"
  profile_behavior:
    minimal: "Use SKILL.md and config-driven retrieval rules only"
    standard: "Use the same review-card workflow and cadence as minimal"
    full: "Use the complete skill directory"

packaging:
  minimal:
    include:
      - "SKILL.md"
      - "config.yaml"
  standard:
    include:
      - "SKILL.md"
      - "config.yaml"
  full:
    include:
      - "**"

validation:
  required_files:
    - "SKILL.md"
    - "config.yaml"
  markdown_contracts:
    - path: "SKILL.md"
      must_contain:
        - "## Card"
        - "### 1. Definition"
        - "### 2. Contrast"
        - "### 3. Boundary"
        - "### 4. Mechanism"
        - "### 5. Application"
        - "D+1"
        - "D+14"

docs:
  summary: "检索练习与间隔复习"
  handles: "把已蒸馏知识转成 review cards 和复习提示"
  not_for: "原始材料总结、知识真实性判断"
  artifacts:
    - "review cards"
    - "review prompts"
    - "复习节奏"
